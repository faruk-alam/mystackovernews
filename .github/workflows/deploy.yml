name: Build and deploy static site

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}

      - name: Check required site URL
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Set the SITE_URL repository variable to your public HTTPS domain."
            exit 1
          fi
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Deploy dist to Hostinger over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ${{ secrets.HOSTINGER_FTP_PROTOCOL || 'ftp' }}
          port: ${{ secrets.HOSTINGER_FTP_PORT || '21' }}
          server-dir: ${{ secrets.HOSTINGER_FTP_SERVER_DIR }}
          local-dir: ./dist/
