<section class="mx-auto max-w-7xl px-4 pt-8 sm:px-6 lg:px-8">
  <nav class="mb-5 text-sm text-muted" aria-label="Breadcrumbs"><a href="{{root_path}}">Home</a> <span aria-hidden="true">/</span> <span aria-current="page">{{category}}</span></nav>
  <div class="mb-8 border-b-2 border-emerald-800 pb-5"><p class="text-xs font-bold uppercase tracking-[.18em] text-accent">The {{category}} desk</p><h1 class="mt-2 text-4xl font-black tracking-tight sm:text-5xl">{{category}}</h1><p class="mt-3 max-w-2xl text-lg text-muted">{{category_description}}</p></div>
  <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">{{articles}}</div>
  <nav class="mt-10 flex items-center justify-center gap-2" aria-label="Pagination">{{pagination}}</nav>
  <section class="mt-14 border-t border-soft pt-8"><h2 class="mb-5 text-2xl font-black">Related coverage</h2><div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">{{related}}</div></section>
</section>
